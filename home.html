<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <link rel="stylesheet" href="home.css">
</head>

<body>
    <div class="container">
        <h1>Login Here</h1>
        <form action="">
            <div> <label for="first-name">First Name</label><br>
                <input type="text" id="first-name" name="first-name">
            </div>
            <div><label for="last-name">Last Name</label><br>
                <input type="text" id="last-name" name="last-name">
            </div>
            <div><label for="email">Email</label><br>
                <input type="email" id="email" name="email">
            </div>
            <div><label for="password">password</label><br>
                <input type="password" id="password" name="password">
            </div>
            <div><label for="country">choose your country</label>
            <select name="country" id="country">

            </select></div>
            <div><label for="gender">choose your gender</label><br>
                <input type="radio" id="gender" value="Male" name="gender">
                <span>Male</span>
                <input type="radio" id="gender" value="Female" name="gender">
                <span>Female</span>
            </div>
            <button>Submit</button>
        </form>
    </div>
</body>

</html>
